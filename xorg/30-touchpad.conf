# 触控板（妙控板）：轻点即点按；指针和双指滚动比 libinput 默认的快一些（手感和 macOS 接近）。
# 系统文件，sudo 拷到 /etc/X11/xorg.conf.d/（见 THEME.md），重新登录生效；蓝牙断开重连后也还在
Section "InputClass"
    Identifier "touchpad"
    Driver "libinput"
    MatchIsTouchpad "on"
    Option "Tapping" "on"
    Option "AccelSpeed" "0.4"
    Option "ScrollPixelDistance" "12"
EndSection
