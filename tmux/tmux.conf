# tmux 設定：macOS 和 Linux 共用這一份。
# Linux 上這個倉庫就是 ~/.config，這裡就是 ~/.config/tmux/tmux.conf；macOS 上 macos/install.sh 把 ~/.config/tmux 連到這個資料夾。
# 只有某個系統要的設定用 if-shell 分開，例如：if-shell '[ "$(uname)" = Darwin ]' 'set -g ...' 'set -g ...'
# ~/.tmux.conf 也是預設位置：兩個都在時 tmux 都讀，先讀它再讀這裡（同一個選項以這裡為準），
# 它的其他設定會混進來（例如舊的 base-index 1），所以那個檔案不要留

set  -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set  -g allow-passthrough on
set -as terminal-features ",*:sixel"
set  -g set-clipboard on
set  -g mouse on
set  -g set-titles on
set  -g history-limit 100000
set  -g window-size latest
setw -g aggressive-resize on
# 關掉視窗後自動補號
set  -g renumber-windows on
# 關掉目前工作階段時跳到下一個，而不是直接 detach：
# 從手機上重新連線很麻煩
set  -g detach-on-destroy off
set -ga terminal-overrides ",*-256color:Tc"

# 背景視窗有新輸出 -> 視窗名變黃，一眼看出哪個程式還在跑、哪個停了
setw -g monitor-activity on
set  -g visual-activity off
set  -g status-position bottom
set  -g status-interval 5
set  -g status-style "bg=default,fg=default"

##### 狀態列視窗清單 #####
# 只把「當前視窗」白底高亮，其餘素淨；不顯示 * 和 # 旗標
setw -g window-status-style          "fg=colour245,bg=default"
setw -g window-status-current-style  "fg=black,bg=white,bold"
setw -g window-status-activity-style "fg=colour220,bg=default"
# 格式只留「編號:名稱」；*（目前）和 #（活動）旗標都來自 #F，直接拿掉
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-separator      ""

##### 快捷鍵 #####
# 分割和新增視窗都繼承目前目錄：不用再 cd 回程式助手做事的地方
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

# Alt+數字直接跳視窗，不用按前綴鍵：手機上少按一次組合鍵
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# 前綴鍵 + hjkl 在窗格之間移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 前綴鍵 + t：彈出一個小終端機跑一次性指令，不打亂程式助手的版面；
# exit 就關
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# 前綴鍵 + r：重新載入設定
bind r source-file ~/.config/tmux/tmux.conf \; display "已重新載入 ~/.config/tmux/tmux.conf"
